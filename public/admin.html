<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Taklifnoma Studiyasi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237b1f4f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin">
<div id="login" class="center-msg" hidden>
  <form class="card" id="loginForm" style="width:min(380px,92vw)">
    <h2>Admin kirishi</h2>
    <div class="field"><label for="pw">Parol</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
    <div class="hint" id="loginErr" style="color:var(--err);min-height:20px"></div>
    <button class="btn primary block" type="submit">Kirish</button>
    <p class="hint" style="margin-bottom:0">Birinchi parol server ishga tushganda konsolda va <code>data/admin-first-password.txt</code> faylida chiqadi.</p>
  </form>
</div>
<div id="app" hidden>
  <header class="topbar">
    <a class="logo" href="/"><b>✦</b><span class="name">Admin</span></a>
    <span class="sp"></span>
    <a class="btn small" href="/editor" target="_blank">Muharrir</a>
    <a class="btn small" href="/" target="_blank">Sayt</a>
    <button class="btn small" id="logout">Chiqish</button>
  </header>
  <nav class="tabs" id="tabs" style="background:#fff"></nav>
  <main class="adm-main" id="main"></main>
</div>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
